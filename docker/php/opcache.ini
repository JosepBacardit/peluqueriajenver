; Local-only tuning. This Dockerfile only backs docker-compose.yml (the
; local dev environment).
;
; app/, resources/, routes/, config/, etc. are still read over the Windows
; bind mount (9p/drvfs), which is slow per file compared to a native
; filesystem (see cobaprojects/obranur, which measured 5-25s per request
; before applying the same tuning plus named volumes for vendor/). With the
; engine default opcache.revalidate_freq=2, OPcache re-stats every included
; file once more than 2s have passed since the last check, which is the
; main cause of that slowness on top of vendor/'s own per-file cost
; (addressed separately by the vendor-data named volume in
; docker-compose.yml).
;
; Raising revalidate_freq means an edited .php file can take up to that many
; seconds to show up instead of being immediate; it is still picked up
; without a restart, just with that delay. `php -r "opcache_reset();"` run
; via `docker compose exec` does NOT speed this up: it resets a separate,
; empty OPcache instance private to that one-off CLI process, not
; php-fpm's. To see a change immediately instead of waiting:
; `docker compose restart app`.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=60

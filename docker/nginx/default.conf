server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    # Docker's embedded DNS (127.0.0.11) is only consulted when fastcgi_pass
    # is a variable, not a bare hostname: nginx resolves a bare hostname
    # once at startup and keeps that IP until nginx itself restarts, so
    # recreating the `app` container (e.g. after `docker compose up -d
    # --build app`) left nginx pointing at a dead IP (502s) until `docker
    # compose restart nginx`. The resolver + variable re-resolve on this
    # TTL instead, so nginx follows `app` across container recreates.
    resolver 127.0.0.11 valid=10s;

    # Compress text-based responses (HTML/JSON/JS/CSS). Already-compressed
    # formats (WebP, PNG, ico) get no benefit from gzip, so they're left out.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml+rss image/svg+xml;

    # Vite fingerprints every file in /build with a content hash, so it can
    # never go stale under a given URL: cache it for a year.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Self-hosted fonts (resources/css/app.css @font-face rules). Unlike
    # /images/ below, these filenames already encode the exact weight,
    # subset and style (e.g. inter-latin-400-normal.woff2), so a font change
    # always ships under a new filename instead of overwriting one in
    # place: safe to cache like /build/. Matches NGINX-CACHE-CONFIG.md.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # /images/ has no content hash in its filenames (favicon.ico,
    # apple-touch-icon.png), so replacing a file in place would be served
    # stale to any client (or intermediate cache, since this is "public")
    # that already cached it, with no way to invalidate that early. A short,
    # revalidatable max-age bounds that staleness window; the fix if a file
    # here ever needs to change is to give it a new name (or move it through
    # Vite), not to raise this further.
    location ^~ /images/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Laravel serves the Blade views and falls back to its front controller.
    # During development, @vite emits the Vite dev-server URL from its hot file.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
